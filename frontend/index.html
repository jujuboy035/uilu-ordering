document.addEventListener('submit',async e=>{if(e.target.id!=='userSearchForm')return;e.preventDefault();if(activeRole!=='admin'||usersLoading)return;userSearch=e.target.elements.query.value.trim();userPage=0;await loadUsers()});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||activeRole!=='admin'||usersLoading)return;if(b.id==='users-refresh'){await loadUsers()}else if(b.id==='users-prev'&&userPage>0){userPage--;await loadUsers()}else if(b.id==='users-next'&&(userPage+1)*50<userTotal){userPage++;await loadUsers()}});

let accountActionBusy=false,accountActionSerial=0;
function resetManagedUI(){document.querySelector('#operationDialog')?.remove();accountActionSerial++;accountActionBusy=false;document.querySelector('#managedAccountDialog')?.remove()}
function openManagedAccount(action,userId='',label=''){
 if(activeRole!=='admin'||accountActionBusy)return;
 document.querySelector('#managedAccountDialog')?.remove();
 const dialog=document.createElement('dialog');dialog.id='managedAccountDialog';document.body.append(dialog);
 dialog.addEventListener('cancel',event=>{event.preventDefault();if(!accountActionBusy){dialog.querySelector('form')?.reset();dialog.remove()}});
 dialog.dataset.action=action;dialog.dataset.userId=userId;dialog.dataset.label=label;drawManagedAccount();
 dialog.showModal();
}
function drawManagedAccount(){
 const dialog=document.querySelector('#managedAccountDialog');if(!dialog)return;
 const old=dialog.querySelector('form'),values=old?Object.fromEntries(new FormData(old)):{};
 const creating=dialog.dataset.action==='create';
 dialog.innerHTML=i18n`<form id="managedAccountForm"><div class="dialog-title"><h2>${creating?t('创建账号'):t('重设密码')}</h2><button type="button" id="managed-account-close" aria-label="${t('关闭')}">×</button></div><p>${creating?t('创建后即可登录，不发送验证邮件。'):t('为此账号设置新的登录密码。')}</p>${creating?i18n`<label style="display:block;margin-top:18px">账号<input name="username" autocomplete="off" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{2,31}" placeholder="customer01"><small>3至32位英文字母、数字、点、横线或下划线；不区分大小写。</small></label><label style="display:block;margin-top:18px">角色<select name="role">${['customer','china','driver','admin'].map(role=>`<option value="${role}">${esc(roleNames[role])}</option>`).join('')}</select></label>`:`<p style="margin-top:18px">${esc(dialog.dataset.label)}</p>`}<label style="display:block;margin-top:18px">${creating?t('初始密码'):t('新密码')}<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label><p class="error" id="managed-account-error" role="alert"></p><button type="submit" class="primary" ${accountActionBusy?'disabled':''}>${accountActionBusy?t('正在处理…'):creating?t('创建账号'):t('保存新密码')}</button></form>`;
 for(const [key,value]of Object.entries(values)){const field=dialog.querySelector('form').elements.namedItem(key);if(field)field.value=value}
}
document.addEventListener('kuilu-language-change',()=>{if(document.querySelector('#managedAccountDialog')?.open)drawManagedAccount()});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||activeRole!=='admin')return;
 if(b.id==='managed-create'){openManagedAccount('create')}
 if(b.dataset.resetAccount){openManagedAccount('reset_password',b.dataset.resetAccount,b.dataset.accountLabel)}
 if(b.id==='managed-account-close'&&!accountActionBusy){document.querySelector('#managedAccountDialog').remove()}
});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='managedAccountForm')return;e.preventDefault();
 if(activeRole!=='admin'||!activeUser||accountActionBusy)return;
 const dialog=e.target.closest('dialog'),form=e.target,serial=++accountActionSerial,userId=activeUser.id;
 const data=Object.fromEntries(new FormData(form));const action=dialog.dataset.action;
 const payload=action==='create'?{action,username:data.username.trim().toLowerCase(),role:data.role,password:data.password}:{action,user_id:dialog.dataset.userId,password:data.password};
 accountActionBusy=true;form.querySelector('[type=submit]').disabled=true;$('#managed-account-error').textContent='';
 try{
  const result=await cloud.functions.invoke('kuilu-manage-accounts',{body:payload});
  if(result.error){let message='账号服务暂时不可用';try{message=(await result.error.context.json()).error||message}catch{}throw Error(message)}
  if(result.data?.error)throw Error(result.data.error);
  if(serial!==accountActionSerial||activeUser?.id!==userId||activeRole!=='admin')return;
  form.reset();dialog.remove();toast(t(action==='create'?'账号已创建，请将账号和初始密码交给使用者。':'密码已重设，请通知使用者使用新密码登录。'));
  userPage=0;await loadUsers();
 }catch(error){if(serial===accountActionSerial&&activeUser?.id===userId&&document.querySelector('#managed-account-error'))$('#managed-account-error').textContent=t(error.message)}
 finally{payload.password='';if(serial===accountActionSerial){accountActionBusy=false;const submit=document.querySelector('#managedAccountForm [type=submit]');if(submit)submit.disabled=false}}
});

let staffView='orders';
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='cloud-logout'){try{let r=await cloud.auth.signOut({scope:'local'});if(r.error)throw r.error;activeUser=null;loadSerial++;addresses=[];orders=[];state=fresh();submitted=null;authMode='login';showAuth()}catch(err){toast(friendly(err))}return}if(b.id==='cloud-refresh'){if(activeUser)await initialize(activeUser);return}if(b.dataset.staffView){staffView=b.dataset.staffView;renderStaff();return}if(b.dataset.viewPhotos){b.disabled=true;try{let o=orders.find(o=>o.dbId===b.dataset.viewPhotos);let imgs=[];for(let c of o.cargo)for(let path of c.photos){let r=await cloud.storage.from('kuilu-cargo').createSignedUrl(path,300);if(r.error)throw r.error;imgs.push(i18n`<a href="${esc(r.data.signedUrl)}" target="_blank" rel="noopener"><img src="${esc(r.data.signedUrl)}" alt="货物照片"></a>`)}$('#photos-'+o.dbId).innerHTML=imgs.join('')||t('<p>此订单未上传照片。</p>')}catch(err){toast(friendly(err))}finally{b.disabled=false}}});
document.addEventListener('submit',async e=>{if(e.target.id==='cloud-auth-form'){e.preventDefault();const submit=e.target.querySelector('[type=submit]');submit.disabled=true;try{const email=loginEmail(e.target.elements.email.value),password=e.target.elements.password.value;const r=await cloud.auth.signInWithPassword({email,password});if(r.error)throw r.error;await initialize(r.data.user)}catch(error){if($('#auth-message'))$('#auth-message').textContent=friendly(error);else toast(friendly(error))}finally{submit.disabled=false}return}
if(!['addressForm','orderForm'].includes(e.target.id))return;e.preventDefault();if(!activeUser||activeRole!=='customer'){toast(t('请使用客户账号登录'));return}if(busy)return;
if(e.target.id==='addressForm'){busy=true;let submit=e.target.querySelector('[type=submit]');submit.disabled=true;try{let data=Object.fromEntries(new FormData(e.target));for(let k of Object.keys(data))data[k]=data[k].trim();let r=await cloud.from('kuilu_addresses').insert({...data,country:e.target.dataset.country}).select('*').single();if(r.error)throw r.error;addresses.unshift(normalizeAddress(r.data));$('#addressDialog').close();render();toast(t('地址已保存，可直接用于下单'))}catch(err){toast(friendly(err))}finally{busy=false;submit.disabled=false}return}
let error=validate(step);if(error){$('#error').textContent=error;return}if(step<5){step++;persist();render();window.scrollTo({top:0,behavior:'smooth'});return}for(let i=0;i<6;i++){error=validate(i);if(error){step=i;render();$('#error').textContent=error;return}}if(submitted)return;busy=true;let submit=e.target.querySelector('[type=submit]');submit.disabled=true;submit.textContent=t('正在提交…');try{state.orderUuid ||= crypto.randomUUID();persist();const id=state.orderUuid;let existing=await cloud.from('kuilu_orders').select('*').eq('id',id).maybeSingle();if(existing.error)throw existing.error;let row=existing.data;if(!row){let payload=JSON.parse(JSON.stringify(state));['entrance','parking','floor','unloading'].forEach(k=>delete payload[k]);payload.schemaVersion=3;payload.pickupTime="当天联系确认";payload.cargo.forEach(c=>{c.boxes=1;delete c.nameEn});delete payload.orderUuid;let retryDraft=state.uploadedPhotos||{};delete payload.uploadedPhotos;for(const cargo of payload.cargo){cargo.photos=[];cargo.qty=Number(cargo.qty);cargo.boxes=1}let r=await cloud.from('kuilu_orders').insert({id,cn_address_id:state.cn,jp_address_id:state.jp,payload}).select('*').single();if(r.error)throw r.error;row=r.data}submitted=normalizeOrder(row);orders=[submitted,...orders.filter(o=>o.dbId!==row.id)];localStorage.removeItem('kuilu-draft-'+activeUser.id);render();window.scrollTo({top:0,behavior:'smooth'})}catch(err){if($('#error'))$('#error').textContent=friendly(err);else toast(friendly(err));submit.disabled=false;submit.textContent=t('确认提交订单 →')}finally{busy=false}});
function declaredTotal(c){return ((Number(c.qty)||0)*Math.round((Number(c.unitPrice)||0)*100)/100).toFixed(2)}
function cargoText(c){return `${t('品名')}：${c.name}\n${t('包装类型')}：${t(c.packaging||'—')}\n${t('申报数量')}：${c.qty}\n${t('申报单价')}：${c.unitPrice||'—'} · ${t('申报总值')}：${c.unitPrice?declaredTotal(c):'—'} ${c.currency||''}`}
function cargoForm(){return i18n`<h2><em>03</em>填写货物信息</h2><p class="intro">地址从地址簿带入；实重和长宽高由司机取货或仓库收货时填写。</p>${state.cargo.map((c,i)=>i18n`<div class="cargo"><div class="cargo-top"><h3>货物 ${i+1}</h3>${state.cargo.length>1?`<button type="button" class="remove" data-remove="${i}">${t('删除明细')}</button>`:''}</div><div class="fields"><label>${t('品名')} <span class="required">*</span><input data-key="${i}.name" list="cargo-names-${i}" value="${esc(c.name)}" placeholder="${t('选择色卡、样衣，或输入其他品名')}" required maxlength="200" autocomplete="off"><datalist id="cargo-names-${i}">${[...new Set(['色卡','样衣',...productPresets.map(p=>p.name)])].map(name=>`<option value="${esc(name)}">${esc(t(name))}</option>`).join('')}</datalist></label>${field(t('包装类型'),'packaging','text',true,['袋子','纸箱'],c,`${i}.`)}${field(t('申报数量'),'qty','number',true,null,c,`${i}.`)}${field(t('申报单价'),'unitPrice','number',true,null,c,`${i}.`)}${field(t('申报币别'),'currency','text',true,['USD','CNY','JPY'],c,`${i}.`)}<label>申报总值<output style="display:block;padding:12px" data-total="${i}">${declaredTotal(c)} ${esc(c.currency||'USD')}</output></label>${area(t('特殊操作要求'),'special',c,`${i}.`)}</div><button type="button" class="secondary" data-save-preset="${i}">保存为常用品名</button></div>`).join('')}<button type="button" class="new-address" id="addCargo">＋ 添加货物明细</button>`}
function orderText(o){const cn=o.addressSnapshot.cn,jp=o.addressSnapshot.jp;return `${t('运单号码')}：${o.id}\n${t('收件姓名')}：${jp.contact}\n${t('收件公司')}：${jp.name}\n${t('收件详细地址')}：${jp.region} ${jp.street}\n${t('收件电话')}：${jp.phone}\n${t('寄件公司')}：${cn.name}\n${t('寄件姓名')}：${cn.contact}\n${t('寄件电话')}：${cn.phone}\n${t('寄件详细地址')}：${cn.region} ${cn.street}\n\n${o.cargo.map((c,i)=>cargoText(c)+'\n'+measurementText(o.measurements?.[i])).join('\n\n')}\n\n${t('取货')}：${o.pickupDate}\n${t('取货说明')}：${o.pickupNote||'—'}\n${t('配送备注')}：${o.deliveryNote||'—'}\n${t('状态')}：${statusNames[o.status]||o.status}\n\n${historyText(o)}`}
function measurementText(m){return m?`${t('收货实重')}：${m.weight} kg · ${t('长')} ${m.length} × ${t('宽')} ${m.width} × ${t('高')} ${m.height} cm`:t('实重与长宽高待取货或收货时填写')}
const actionNames={submitted:'顾客已下单',assign:'已分配取货司机',pickup:'司机已取货',receive:'中国仓库已收货'};
function historyText(o){return (o.history||[]).map(e=>`${userDate(e.at)} · ${t(actionNames[e.action]||e.action)}${e.measurements?.length?'\n'+e.measurements.map(measurementText).join('\n'):''}`).join('\n')}
function workflowControls(o){const staff=['admin','china'].includes(activeRole);let controls='';if(staff&&['pending_review','approved','pickup'].includes(o.status))controls+=`<button type="button" class="secondary" data-operation="assign" data-order="${o.dbId}">${t('分配取货司机')}</button>`;if(activeRole==='driver'&&o.status==='pickup'&&o.driverId===activeUser?.id)controls+=`<button type="button" class="primary" data-operation="pickup" data-order="${o.dbId}">${t('确认取货')}</button>`;if(staff&&['pending_review','approved','pickup','picked_up'].includes(o.status))controls+=`<button type="button" class="primary" data-operation="receive" data-order="${o.dbId}">${t('中国仓库收货')}</button>`;return controls}
function renderStaff(){if(staffView==='users'&&activeRole==='admin'){void loadUsers();return}document.querySelectorAll('[data-staff-view]').forEach(b=>b.classList.toggle('active',b.dataset.staffView==='orders'));document.title=roleNames[activeRole]+t('工作台 · 奎陆中日手提');$('#pageTitle').textContent=roleNames[activeRole]+t('工作台');$('#crumb').textContent=t('订单列表');$('#saveDraft').style.display='none';$('#pageDesc').textContent=t('顾客下单 → 司机取货 → 中国仓库收货');$('#app').innerHTML=i18n`<div class="panel"><h2>订单列表 <span class="tag">${orders.length} 单</span></h2><p class="intro">可分配司机取货，也支持货物直接送至中国仓库收货。</p>${orders.map(o=>i18n`<article class="cloud-order"><h3>${esc(o.id)} <span class="tag">${esc(statusNames[o.status]||o.status)}</span></h3><p>${esc(o.addressSnapshot.cn.name)} → ${esc(o.addressSnapshot.jp.name)}</p><p>${o.cargo.map(c=>esc(c.name)).join(' / ')}</p><p>${o.driverId?`${t('取货司机')}：${esc(driverRows.find(d=>d.id===o.driverId)?.name||o.driverId)}`:''}</p><div class="cloud-toolbar">${workflowControls(o)}</div><details><summary class="text-btn">查看要求与联系人</summary><pre>${esc(orderText(o))}</pre><button type="button" class="secondary" data-view-photos="${o.dbId}">查看货物照片</button><div class="cloud-photos" id="photos-${o.dbId}"></div></details></article>`).join('')||t('<p>暂无可查看的订单。</p>')}</div>`}
let operationBusy=false;
function operationDialog(id,action){if(operationBusy)return;const o=orders.find(r=>r.dbId===id);if(!o)return;$('#operationDialog')?.remove();const d=document.createElement('dialog');d.id='operationDialog';d.dataset.order=id;d.dataset.action=action;d.innerHTML=i18n`<form id="operationForm"><div class="dialog-title"><h2>${t(action==='assign'?'分配取货司机':action==='pickup'?'确认取货':'中国仓库收货')}</h2><button type="button" id="operationClose">×</button></div><p>${esc(o.id)}</p>${action==='assign'?`<label>${t('取货司机')}<select name="driver" required><option value="">${t('请选择司机')}</option>${driverRows.map(r=>`<option value="${esc(r.id)}" ${r.id===o.driverId?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>${driverRows.length?'':`<p>${t('暂无司机，请管理员先创建司机账号。')}</p>`}`:i18n`<p>按每项货物填写实重和包装长宽高；多箱不同尺寸请分开为不同货物明细。</p>${o.cargo.map((c,i)=>`<fieldset style="border:1px solid #ddd;padding:15px;margin:15px 0"><legend>${esc(c.name)}</legend><div class="fields">${[['weight','收货实重（kg）'],['length','长（cm）'],['width','宽（cm）'],['height','高（cm）']].map(([k,label])=>`<label>${t(label)}<input name="${i}.${k}" type="number" min="0.001" max="1000000" step="0.001" required value="${esc(o.measurements?.[i]?.[k]??'')}"></label>`).join('')}</div></fieldset>`).join('')}`}<p id="operationError" class="error" role="alert"></p><button type="submit" class="primary">确认保存</button></form>`;d.addEventListener('cancel',e=>{if(operationBusy)e.preventDefault();else d.remove()});document.body.append(d);d.showModal()}
document.addEventListener('input',()=>{document.querySelectorAll('[data-total]').forEach(el=>{const c=state.cargo[Number(el.dataset.total)];if(c)el.textContent=declaredTotal(c)+' '+(c.currency||'USD')})});

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.operation)operationDialog(b.dataset.order,b.dataset.operation);if(b.id==='operationClose'&&!operationBusy)$('#operationDialog')?.remove();if(b.dataset.savePreset!==undefined){const c=state.cargo[Number(b.dataset.savePreset)];if(!c.name.trim()||!c.packaging?.trim()||!Number.isFinite(Number(c.unitPrice))||Number(c.unitPrice)<=0){toast(t('请先填写品名、包装及单价'));return}b.disabled=true;const uid=activeUser?.id;try{const r=await cloud.from('kuilu_product_presets').upsert({user_id:uid,name:c.name.trim(),name_en:'',packaging:c.packaging.trim(),unit_price:Number(c.unitPrice),currency:c.currency},{onConflict:'user_id,name,name_en'}).select('*').single();if(r.error)throw r.error;if(activeUser?.id!==uid)return;productPresets=[r.data,...productPresets.filter(p=>p.id!==r.data.id)];toast(t('品名预设已保存'));render()}catch(err){toast(friendly(err))}finally{b.disabled=false}}});
document.addEventListener('submit',async e=>{if(e.target.id!=='operationForm')return;e.preventDefault();if(operationBusy)return;const d=e.target.closest('dialog'),o=orders.find(r=>r.dbId===d.dataset.order),action=d.dataset.action,form=e.target;if(!o||!activeUser)return;const actor=activeUser.id;const data=new FormData(form);const measured=action==='assign'?[]:o.cargo.map((c,i)=>Object.fromEntries(['weight','length','width','height'].map(k=>[k,Number(data.get(i+'.'+k))])));operationBusy=true;form.querySelector('[type=submit]').disabled=true;try{const r=await cloud.rpc('kuilu_order_action',{p_id:o.dbId,p_action:action,p_driver:action==='assign'?data.get('driver'):null,p_measurements:measured});if(r.error)throw r.error;d.remove();if(activeUser?.id===actor){toast(t('订单已更新'));await loadData()}}catch(err){if($('#operationError'))$('#operationError').textContent=friendly(err);else toast(friendly(err))}finally{operationBusy=false;form.querySelector('[type=submit]').disabled=false}});

cloud.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){activeUser=null;loadSerial++;showAuth()}if(event==='TOKEN_REFRESHED'&&!session?.user){activeUser=null;showAuth()}});
